[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairim-nu-cost"
version = "0.1.0"
description = "Non-Uniform Fair Influence Maximisation Heuristic Algorithms"
authors = [
    { name = "Jacob Hogarty", email = "jacob.hogarty@yahoo.com" },
]
readme = "README.md"
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/jacobhogarty/fairim-nu-cost"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]